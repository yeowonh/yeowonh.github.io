name: Deploy to GitHub Pages

# ─────────────────────────────────────────────────────────────
# public 저장소에서 main에 push하면 자동으로 배포한다.
# ─────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹칠 때 진행 중인 것을 취소하지 않고 순서대로 처리한다
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build with Astro
        uses: withastro/action@v6
        with:
          out-dir: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
